<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div id="source-label" class="source-label" hidden></div>
      <button id="primary-action" hidden></button>
      <p id="primary-description" hidden></p>
      <details id="more-options" hidden>
        <summary>More options</summary>
        <section id="actions" hidden></section>
        <div id="export-options" hidden>
        <label><input id="include-integrity" type="checkbox"> Include capture time and SHA-256</label>
        <label><input id="include-debug" type="checkbox"> Include debug info</label>
        <small>Applies to all actions, including selection copy. Debug info may contain captured content.</small>
        </div>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
